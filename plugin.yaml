name: check-please
label: Check, Please
kind: standalone
version: 0.3.0
requires_hermes: ">=0.22.6"
description: >
  Pairs every "done" claim in your agent's reply (sent, deployed, pushed, tests pass, saved, paid)
  with the tool call that proves it, and appends one line saying which claims are backed, stale or
  not backed. Deterministic: no extra model calls, no network.
author: Whalen Ventures
provides_hooks:
  - pre_llm_call
  - post_tool_call
  - transform_llm_output
  - pre_verify
config_schema:
  line:
    type: str
    choices: [all, issues, off]
    default: all
    label: Check line
    description: "all = add a line under every reply with claims; issues = only when something is not backed; off = /check only"
  verify_nudge:
    type: bool
    default: true
    label: Verify nudge
    description: "On coding turns, ask the agent to rerun tests before finishing when tests last passed before a later edit with no rerun since. Set false to disable."
  inline_unbacked:
    type: bool
    default: false
    label: Show not-backed claims inline
    description: "Off by default: a not-backed claim means no receipt was found, not a proven contradiction, so it only shows in /check and the Desktop pane. Set true to also interrupt the reply itself for the higher-stakes kinds (sent, paid, deployed, pushed, deleted, scheduled), the old behavior. Stale and failed claims always interrupt the reply either way."
